# Optional GitLab equivalent of .github/workflows/sonarqube.yml
stages: [test, scan]

test:
  stage: test
  image: node:24-alpine
  script:
    - npm ci
    - npm run test:coverage
  artifacts:
    paths: [coverage/lcov.info]

sonarqube:
  stage: scan
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths: [.sonar/cache]
  script:
    - sonar-scanner -Dsonar.qualitygate.wait=true # SONAR_HOST_URL + SONAR_TOKEN from CI/CD variables
  needs: [test]
