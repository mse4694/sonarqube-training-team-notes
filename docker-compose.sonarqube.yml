# Local SonarQube for the hands-on labs (NOT for production).
#
#   docker compose -f docker-compose.sonarqube.yml up -d
#   open http://localhost:9000   (first login admin / admin -> forced password change)
#
# Elasticsearch inside SonarQube needs vm.max_map_count >= 262144 on the HOST:
#   Linux:            sudo sysctl -w vm.max_map_count=262144
#   Docker Desktop:   already OK (or: wsl -d docker-desktop sysctl -w vm.max_map_count=262144)
# No sudo? export SONAR_SEARCH_JAVAADDITIONALOPTS=-Dnode.store.allow_mmap=false
#   (slower search index, fine for a classroom).
#
# Image tags:
#   sonarqube:community        -> Community Build (free; NO taint analysis / no branch analysis)
#   sonarqube:2025-lts-developer / sonarqube:enterprise -> commercial editions used in the real
#   class to demo taint analysis (SQLi/XSS/SSRF data flow). They need a license key.
name: sonarqube-lab

services:
  sonarqube:
    image: ${SONARQUBE_IMAGE:-sonarqube:community}
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      SONAR_SEARCH_JAVAADDITIONALOPTS: ${SONAR_SEARCH_JAVAADDITIONALOPTS:-}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: ${SONAR_ES_BOOTSTRAP_CHECKS_DISABLE:-false}
    ports:
      - "127.0.0.1:9000:9000"
    mem_limit: 3g
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  sonar-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: sonar
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - sonar_pgdata:/var/lib/postgresql/data

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_pgdata:
