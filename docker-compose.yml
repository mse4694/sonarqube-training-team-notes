# Team Notes: PostgreSQL + ASP.NET Core API + Next.js web
#   docker compose up -d --build
#   web  -> http://localhost:3000      api -> http://localhost:8080
name: team-notes

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://notes:notes@db:5432/notes}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8080}
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8080}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    mem_limit: 512m

  # Reusable SDK/CLI container for the labs; start explicitly via scripts/lab-tools.
  lab-tools:
    image: team-notes-lab-tools:latest
    command: ["sleep", "infinity"]
    profiles: ["tools"]
    build:
      context: .
      dockerfile: scripts/lab-tools.Dockerfile
    working_dir: ${LAB_REPO_DIR:-/work}
    environment:
      LAB_WORKSPACE: ${LAB_REPO_DIR:-/work}
      NUGET_PACKAGES: /nuget
    volumes:
      - "${LAB_REPO_DIR:-.}:${LAB_REPO_DIR:-/work}"
      - lab-nuget:/nuget
    # Keep existing curl examples for localhost:8080 connected to the running API.
    network_mode: service:api
    mem_limit: 2g

  pgadmin:
    image: dpage/pgadmin4:9.18@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@team-notes.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgadmin-pass-123}
      # Allow the reserved .test domain used by this training account.
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['test']"
      PGADMIN_DISABLE_POSTFIX: "1"
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_LISTEN_PORT: "80"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m

volumes:
  pgdata:
  pgadmin-data:
  lab-nuget:
