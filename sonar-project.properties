# SonarQube analysis settings for Team Notes (JS/TS + Docker + secrets)
sonar.projectKey=team-notes
sonar.projectName=Team Notes (SonarQube training)
sonar.projectVersion=0.1.0

# Production code = whole repo minus tests and generated/vendor folders
sonar.sources=.
sonar.exclusions=node_modules/**,.next/**,coverage/**,public/**,tests/**,uploads/**
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx

# Coverage from `npm run test:coverage` (Vitest + v8 -> lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=*.config.*,next.config.ts

sonar.sourceEncoding=UTF-8
