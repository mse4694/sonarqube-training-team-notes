# Build, test and scan Team Notes with SonarScanner for .NET (C# + TypeScript in one analysis).
#
# Works with SonarQube Server and SonarQube Cloud. Configure in your fork:
#   Settings -> Secrets and variables -> Actions
#     Secrets:   SONAR_TOKEN        (required; analysis token from SonarQube)
#                SONAR_HOST_URL     (SonarQube Server URL; omit for SonarQube Cloud = https://sonarcloud.io)
#     Variables: SONAR_PROJECT_KEY  (optional; default "<owner>_<repo>", the key SonarQube Cloud gives imported repos)
#                SONAR_ORGANIZATION (SonarQube Cloud only; your organization key)
#                SONAR_BRANCH_ANALYSIS (Server Developer+: "true" to analyze named branches; Cloud automatic)
#                SONAR_QUALITYGATE_WAIT (optional; "false" = do not fail the job on a red Quality Gate)
# SONAR_HOST_URL / SONAR_ORGANIZATION may also be set as variables instead of secrets.
#
# No SONAR_TOKEN (e.g. a fresh fork, or a PR from a fork) -> the scan job is skipped and the run
# stays green with a notice explaining what to configure.
name: SonarQube

on:
  push:
    branches: [main, solution]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Check SonarQube configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION || vars.SONAR_ORGANIZATION || '' }}
          SONAR_BRANCH_ANALYSIS: ${{ vars.SONAR_BRANCH_ANALYSIS || 'false' }}
          SONAR_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            if [ -z "$SONAR_ORGANIZATION" ] && [ "$SONAR_HOST_URL" != "https://sonarcloud.io" ] && [ "$SONAR_BRANCH_ANALYSIS" != "true" ] && { [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_REF_NAME" != "$SONAR_DEFAULT_BRANCH" ]; }; then
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Branch or PR analysis unavailable::Enable SONAR_BRANCH_ANALYSIS for a Server edition that supports PR analysis. Community Build supports main-branch scans only."
              exit 0
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN is set: the SonarQube scan will run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            msg="SONAR_TOKEN is not set, so the SonarQube scan is skipped. Add the SONAR_TOKEN secret (and SONAR_HOST_URL for SonarQube Server, or SONAR_ORGANIZATION for SonarQube Cloud) under Settings -> Secrets and variables -> Actions, then re-run. See README: Fork แล้ว scan ด้วย SonarQube."
            echo "::notice title=SonarQube scan skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

  build-test-scan:
    name: Build, test, scan
    needs: config
    if: needs.config.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Same database the xUnit suite uses in docker-compose.test.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: notes
          POSTGRES_DB: notes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notes -d notes"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION || vars.SONAR_ORGANIZATION || '' }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}
      SONAR_BRANCH_ANALYSIS: ${{ vars.SONAR_BRANCH_ANALYSIS || 'false' }}
      SONAR_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      SONAR_PR_HEAD: ${{ github.head_ref }}
      SONAR_PR_BASE: ${{ github.base_ref }}
      SONAR_QUALITYGATE_WAIT: ${{ vars.SONAR_QUALITYGATE_WAIT || 'true' }}
      # Test-only settings, mirroring docker-compose.test.yml (fake training values, not secrets).
      DATABASE_URL: postgres://notes:notes@localhost:5432/notes
      SESSION_SECRET: test-session-secret-0123456789-not-the-committed-one
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history: better blame + new-code detection

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # SonarScanner for .NET runs on the JVM.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ---- web: unit tests + lcov coverage -----------------------------------
      - name: Web dependencies
        run: npm ci
        working-directory: web
      # XSS tests fail on `main` by design; keep going so lcov is still produced and imported.
      - name: Web tests with lcov coverage
        run: npm run test:coverage
        working-directory: web
        continue-on-error: true

      # ---- SonarScanner for .NET: begin -> build -> test -> end --------------
      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarQube begin
        run: |
          args=(
            /k:"$SONAR_PROJECT_KEY"
            /d:sonar.host.url="$SONAR_HOST_URL"
            /d:sonar.token="$SONAR_TOKEN"
            /d:sonar.cs.opencover.reportsPaths="api.Tests/coverage/**/coverage.opencover.xml"
            /d:sonar.javascript.lcov.reportPaths="web/coverage/lcov.info"
            /d:sonar.exclusions="**/bin/**,**/obj/**,web/node_modules/**,web/.next/**,**/coverage/**"
            /d:sonar.qualitygate.wait="$SONAR_QUALITYGATE_WAIT"
          )
          if [ -n "$SONAR_ORGANIZATION" ]; then
            args+=(/o:"$SONAR_ORGANIZATION")
          fi
          # workflow_dispatch is not auto-detected as branch analysis by the scanner.
          # Explicit scope also keeps PR analysis separate from its source branch.
          if [ -n "$SONAR_PR_NUMBER" ]; then
            args+=(/d:sonar.pullrequest.key="$SONAR_PR_NUMBER"
                   /d:sonar.pullrequest.branch="$SONAR_PR_HEAD"
                   /d:sonar.pullrequest.base="$SONAR_PR_BASE")
          elif [ -n "$SONAR_ORGANIZATION" ] || [ "$SONAR_BRANCH_ANALYSIS" = "true" ]; then
            args+=(/d:sonar.branch.name="$GITHUB_REF_NAME")
          fi
          echo "Project key: $SONAR_PROJECT_KEY  Host: $SONAR_HOST_URL  Organization: ${SONAR_ORGANIZATION:-<none>}"
          dotnet sonarscanner begin "${args[@]}"

      - name: Build
        run: dotnet build api.Tests/Api.Tests.csproj -c Release

      # Security tests fail on `main` by design; keep going so the scan still runs + imports coverage.
      - name: xUnit tests with OpenCover coverage
        continue-on-error: true
        env:
          UPLOADS_DIR: ${{ github.workspace }}/uploads
        run: >
          dotnet test api.Tests/Api.Tests.csproj -c Release --no-build
          --collect:"XPlat Code Coverage" --settings api.Tests/coverlet.runsettings
          --results-directory ${{ github.workspace }}/api.Tests/coverage

      - name: SonarQube end (uploads, waits for the Quality Gate)
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
